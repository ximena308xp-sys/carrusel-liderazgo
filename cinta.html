<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La cinta</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#1c5931;--amarillo:#f1b542;--cafe:#543725;--gris:#464842}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Poppins',sans-serif}
body.bg{background:#fff}
#fit{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:center}
.c{position:absolute;left:0;top:130px;width:200px;height:200px;margin-left:-100px;border-radius:50%;background:var(--verde);cursor:pointer;display:flex;align-items:center;justify-content:center;
   transition:transform .9s cubic-bezier(.3,1.3,.45,1),opacity .6s,background .5s,box-shadow .5s;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.c svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .5s}
.n{position:absolute;top:-4px;left:-4px;width:64px;height:64px;border-radius:50%;background:var(--amarillo);color:var(--verde);font-weight:700;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:background .5s,color .5s}
.c.on .n{background:var(--verde);color:#fff}
.ic{width:52%;height:52%;background:#fff;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;transition:background .5s}
.c.on .ic{background:var(--verde)}
.c.on{background:var(--amarillo);box-shadow:0 0 0 14px rgba(241,181,66,.28),0 14px 28px rgba(0,0,0,.22)}
.c.on svg{stroke:var(--verde)}
.txt{position:absolute;left:130px;width:700px;top:385px;text-align:center}
.txt h2 b{color:var(--amarillo);margin-right:12px}
.txt h2{font-size:38px;font-weight:700;color:var(--verde);line-height:1.15}
.txt.in{animation:in .6s cubic-bezier(.3,1.2,.5,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.dots{position:absolute;left:0;width:960px;top:498px;display:flex;justify-content:center;gap:9px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(70,72,66,.28);transition:all .4s}
.dots i.on{width:26px;border-radius:5px;background:var(--verde)}
</style></head><body>

const MAP=[0,1,2,3,4,5];
const rib=document.getElementById('ribbon'),txt=document.getElementById('txt'),dots=document.getElementById('dots');
const cs=items.map((it,k)=>{const c=document.createElement('div');c.className='c';c.innerHTML=MAP[k]!==null?'<span class="ic" style="-webkit-mask-image:url('+IMG[MAP[k]]+');mask-image:url('+IMG[MAP[k]]+')"></span>':'<svg viewBox="0 0 24 24">'+it.i+'</svg>';c.onclick=()=>{stop();go(k)};rib.appendChild(c);const d=document.createElement('i');dots.appendChild(d);return c});
const SC=[1,.5,.38,.3],OP=[1,.9,.55,.25];
const X=d=>{if(d===0)return 480;const s=Math.sign(d),a=Math.abs(d);return 480+s*(185+(a-1)*88)};
let cur=-1;
const N=items.length,prev=cs.map(()=>null);
function go(n){
  n=((n%N)+N)%N;
  cs.forEach((c,k)=>{let d=((k-n+N)%N);if(d>N/2)d-=N;
    const a=Math.min(Math.abs(d),3),jump=prev[k]!==null&&Math.abs(d-prev[k])>3;
    if(jump){c.style.transition='none'}
    c.style.transform='translateX('+X(d)+'px) scale('+SC[a]+')';
    c.style.opacity=Math.abs(d)>2?0:OP[a];c.style.zIndex=10-Math.abs(d);c.classList.toggle('on',d===0);
    if(jump){void c.offsetWidth;c.style.transition=''}
    prev[k]=d});
  [...dots.children].forEach((e,k)=>e.classList.toggle('on',k===n));
  if(n!==cur){txt.classList.remove('in');void txt.offsetWidth;txt.querySelector('b').textContent=(n+1)+'.';txt.querySelector('span').textContent=items[n].t.replace(/\.$/,'');txt.classList.add('in')}
  cur=n;
}
let timers=[];const stop=()=>{timers.forEach(clearTimeout);timers=[]};
const q=new URLSearchParams(location.search);
if(q.get('bg'))document.body.classList.add('bg');
go(+q.get('i')||0);
if(!q.get('i')){items.forEach((_,k)=>{if(k>0)timers.push(setTimeout(()=>go(k),START+EACH*(k-1)))})}
addEventListener('keydown',e=>{stop();if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
const fit=document.getElementById('fit');
function rs(){const s=Math.min(innerWidth/960,innerHeight/540);fit.style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',rs);rs();
