<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablet con scroll</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap">
<style>
/* Tablet que hace scroll: aparecen las frases y luego 4 círculos que el dedo lleva a izquierda y derecha. Fondo transparente. */
:root { --verde: #1c5931; --amarillo: #f1b542; --crema: #f2d091; --naranja: #f1a54a; --gris: #464842; --cafe: #543725; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Poppins", system-ui, sans-serif; }
body { display: grid; place-items: center; }
#fit { width: 960px; height: 540px; position: relative; transform-origin: center center; flex: none; }

.phone { position: absolute; left: 250px; top: 100px; width: 460px; height: 340px; border-radius: 30px; background: var(--gris);
  padding: 12px; box-shadow: 0 30px 50px -22px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.08); }
.phone::before { content: ""; position: absolute; top: 4px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #2d2e2b; z-index: 6; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 18px; background: #fff; overflow: hidden; }

.list { position: absolute; left: 18px; right: 18px; top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; pointer-events: none; }
.tx { background: #fff; border-radius: 14px; padding: 9px 14px 9px 16px; font-weight: 600; font-size: 14px; line-height: 1.3; color: var(--cafe);
  border-left: 6px solid var(--c); box-shadow: 0 10px 18px -10px rgba(0,0,0,.35); opacity: 0; }
.tx:last-child { grid-column: 1 / -1; }
.tx.last { color: var(--verde); font-weight: 800; }

.ttl { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 120px; text-align: center; font-weight: 800; font-size: 34px; line-height: 1.12; color: var(--verde); letter-spacing: -.01em; opacity: 0; pointer-events: none; }
.circle { position: absolute; width: 66px; height: 66px; border-radius: 50%; background: var(--c); opacity: 0; z-index: 7;
  box-shadow: 0 22px 34px -16px rgba(0,0,0,.4); }

.circle img { position: absolute; left: 15%; top: 15%; width: 70%; height: 70%; display: block; }
.lbl { position: absolute; z-index: 5; display: grid; align-items: center; text-align: center; height: 66px; font-weight: 600; font-size: 16px; line-height: 1.25; color: #222; white-space: pre-line; opacity: 0; pointer-events: none; }
.hand { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 9; pointer-events: none; opacity: 0; }
.hand img { position: absolute; left: -75px; top: -22px; width: 300px; max-width: none; display: block; filter: drop-shadow(0 14px 12px rgba(0,0,0,.28)); -webkit-mask-image: linear-gradient(#000 78%, transparent 100%); mask-image: linear-gradient(#000 78%, transparent 100%); }

@media (prefers-reduced-motion: reduce) { .tx, .circle, .ttl { opacity: 1 !important; animation: none !important; transform: none !important; } .hand { display: none; } }
</style>
</head>

const H = (s, x, y, o, ease) => hk += pct(s) + "{transform:translate(" + x + "px," + y + "px);opacity:" + o + ";" + (ease ? "animation-timing-function:" + ease + ";" : "") + "}";

// 1) Frases: 5 scrolls
const s0 = 1.6, gap = 2.6, swipeX = 560;
H(0, swipeX + 50, 620, 0);
H(s0 - 0.5, swipeX, 400, 1, EASE);
const endA = s0 + gap * (textos.length - 1) + 1.7;
textos.forEach((t, i) => {
  const s = s0 + gap * i, e = s + 1.7, at = s + 0.5;
  H(s, swipeX, 400, 1, EASE);
  H(e, swipeX, 305, 1);
  if (i < textos.length - 1) { H(e + 0.3, swipeX, 305, 0); H(e + 0.6, swipeX, 400, 0); H(s + gap - 0.01, swipeX, 400, 1); }
  css += "@keyframes tx" + i + "{0%," + pct(at) + "{opacity:0;transform:translateY(46px) scale(.94)}" + pct(at + 1.2) + "," + pct(endA + 3.6) + "{opacity:1;transform:none}" + pct(endA + 4.4) + ",100%{opacity:0;transform:translateY(-10px)}}";
});
// 2) Círculos
const tB0 = endA + 6.0, per = 4.4;
css += "@keyframes ttl{0%," + pct(endA + 4.4) + "{opacity:0;transform:translateY(18px)}" + pct(endA + 5.3) + "," + pct(T - 2.4) + "{opacity:1;transform:none}" + pct(T - 1) + ",100%{opacity:0;transform:none}}";
dest.forEach(([tx, ty], k) => {
  const tB = tB0 + per * k, grab = tB + 1.5, drop = grab + 1.1;
  const ux = (tx - CX) / Math.hypot(tx - CX, ty - CY), uy = (ty - CY) / Math.hypot(tx - CX, ty - CY);
  H(tB - 0.1, swipeX, 540, 0);
  H(tB, CX + 40, 470, 1, EASE);
  H(tB + 1.1, CX + 40, 380, 1);
  H(tB + 1.3, CX, CY + 6, 1, EASE);              // toca el círculo
  H(grab, CX, CY + 6, 1, EASE);
  H(grab + 0.3, CX + ux * 90, CY + 6 + uy * 90, 1, "cubic-bezier(.2,.8,.2,1)");   // el pulgar lo empuja
  H(grab + 0.8, CX + ux * 90, CY + 6 + uy * 90, 0);
  const dx = CX - tx, dy = CY - ty;
  css += "@keyframes l" + k + "{0%," + pct(drop - 0.1) + "{opacity:0;transform:translateX(-14px)}" + pct(drop + 0.7) + "," + pct(T - 2.4) + "{opacity:1;transform:none}" + pct(T - 1) + ",100%{opacity:0;transform:none}}";
  css += "@keyframes c" + k + "{0%," + pct(tB - 0.03) + "{opacity:0;transform:translate(" + dx + "px," + dy + "px) scale("+(S*.92)+")}" +
         pct(tB) + "," + pct(grab) + "{opacity:1;transform:translate(" + dx + "px," + dy + "px) scale("+(S*.92)+");animation-timing-function:cubic-bezier(.1,.85,.25,1)}" +
         pct(drop) + "{opacity:1;transform:none}" + pct(T - 2.4) + "{opacity:1;transform:none}" + pct(T - 1) + ",100%{opacity:0;transform:none}}";
});
H(tB0 + per * 3 + 4, CX, 620, 0);
H(T, swipeX + 50, 620, 0);
css += "@keyframes hand{" + hk + "}";

const circles = document.getElementById("circles");
dest.forEach(([tx, ty], k) => {
  const c = document.createElement("div");
  c.className = "circle";
  c.style.left = (tx - R) + "px"; c.style.top = (ty - R) + "px";
  c.style.setProperty("--c", ccol[k]);
  c.innerHTML = '<img alt="" src="' + iconos[k] + '">';
  c.style.animation = "c" + k + " " + T + "s linear infinite";
  circles.appendChild(c);
});
list.querySelectorAll(".tx").forEach((d, i) => d.style.animation = "tx" + i + " " + T + "s cubic-bezier(.25,.8,.3,1) infinite");
dest.forEach(([tx, ty], k) => {
  const l = document.createElement("div");
  l.className = "lbl"; l.textContent = labels[k];
  l.style.left = lblBox[k][0] + "px"; l.style.width = lblBox[k][1] + "px"; l.style.top = (ty - R) + "px";
  l.style.animation = "l" + k + " " + T + "s cubic-bezier(.25,.8,.3,1) infinite";
  circles.appendChild(l);
});
document.getElementById("ttl").style.animation = "ttl " + T + "s cubic-bezier(.25,.8,.3,1) infinite";
const hand = document.getElementById("hand");
hand.style.animation = "hand " + T + "s linear infinite";
const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

// Ajusta el tamaño a cualquier recuadro
const fit = document.getElementById("fit");
function resize() { fit.style.transform = "scale(" + Math.min(innerWidth / 960, innerHeight / 540) + ")"; }
addEventListener("resize", resize); resize();
</script>
</body>
</html>
