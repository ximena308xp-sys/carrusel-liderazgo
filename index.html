<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrusel de Liderazgo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Concepto: toda la pantalla es amarilla. Detrás hay una fila con las 4 ilustraciones.
   El círculo es una ventana (el resto tapa las demás ilustraciones): viaja de una a otra y deja ver solo la suya.
   El texto vive en la parte amarilla que queda tapada. Verde y amarillo de Sweet & Coffee. Look único, a propósito. */
:root {
  color-scheme: light;
  --yellow: #f1b542;
  --ink: #1c5931;
  --muted: #543725;
  --win: #f2d091;
  --slot-line: rgba(18, 57, 31, .45);
  --shadow: rgba(84, 55, 37, .35);
  --font: "Poppins", system-ui, sans-serif;
}
* { box-sizing: border-box; }
:root { overflow-x: hidden; }
html, body { height: 100%; }
body { background: var(--yellow); color: var(--ink); font-family: var(--font); margin: 0; overflow: hidden; }
main { height: 100%; }
.wrap { position: relative; width: 100%; height: 100%; }

/* ---- escena ---- */
.scene { position: absolute; inset: 0; overflow: hidden; background: var(--win); }

/* la ventana: transparente por dentro, el amarillo cubre todo lo demás */
.hole {
  position: absolute; left: 0; top: 0; z-index: 2; border-radius: 50%;
  border: 6px solid var(--ink);
  box-shadow: 0 0 0 150vmax var(--yellow);
  transition: transform 1.05s cubic-bezier(.65,0,.25,1);
  pointer-events: none;
}

.slot {
  position: absolute; z-index: 1;
  width: var(--sw); aspect-ratio: 4 / 3;
  left: var(--x); top: 50%;
  margin: calc(var(--sw) * -.375) 0 0 calc(var(--sw) / -2);
  display: grid; place-items: center;
  border: 0; padding: 0; background: none; color: var(--ink); font: inherit; cursor: pointer;
  transform: scale(.9);
  transition: transform .9s cubic-bezier(.3,1.3,.5,1);
}
/* en reposo las ilustraciones son pequeñas (así el círculo nunca deja ver a las vecinas); la activa crece para llenar la ventana */
.slot.on { transform: scale(var(--sc, 1.9)); }
.slot .ph {
  width: 100%; height: 100%; border-radius: 22px;
  background: rgba(255,255,255,.45);
  display: grid; place-items: center; align-content: center; gap: 6px; text-align: center; padding: 8px;
  font-size: clamp(.6rem, 1.4vw, .85rem); font-weight: 600; line-height: 1.2;
}
.slot .ph svg { width: 30%; max-width: 36px; }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 16px 14px var(--shadow)); }
.slot.drag .ph { background: rgba(255,255,255,.75); }

/* ---- texto (en la zona amarilla) ---- */
.copy { position: absolute; z-index: 3; inset: 0; pointer-events: none; }
.item { position: absolute; top: 50%; transform: translateY(-50%); width: 36%; isolation: isolate; }
.item.right { left: var(--pos); }
.item.left { right: var(--pos); }
.item h2 {
  margin: 0 0 16px; font-weight: 800; line-height: 1.02; letter-spacing: -.01em;
  font-size: clamp(1.8rem, 5vw, 4.8rem); text-wrap: balance;
  opacity: 0; transform: translateY(22px); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.9,.3,1);
}
.item p {
  margin: 0; font-size: clamp(1.1rem, 2.9vw, 2.5rem); line-height: 1.35; color: var(--muted); max-width: 24ch; font-weight: 500;
  opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.9,.3,1);
}
/* número grande y transparente detrás del párrafo */
.item.on h2 { opacity: 1; transform: none; transition-delay: .6s; }
.item.on p { opacity: 1; transform: none; transition-delay: .8s; }

/* ---- controles ---- */
.controls { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 18px; }
.nav {
  width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--ink); color: var(--yellow);
  display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 20px -10px var(--shadow);
  transition: transform .25s cubic-bezier(.3,1.4,.5,1);
}
.nav:hover { transform: scale(1.1); } .nav:active { transform: scale(.95); }
.nav svg { width: 22px; height: 22px; }
.dots { display: flex; gap: 10px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 99px; border: 0; padding: 0; background: rgba(28,89,49,.3); cursor: pointer; transition: width .5s cubic-bezier(.65,0,.25,1), background .3s; }
.dot[aria-current="true"] { width: 38px; background: var(--ink); }
.hint { margin: 0; font-size: .82rem; color: var(--muted); text-align: center; max-width: 56ch; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

@media (max-aspect-ratio: 5/4), (max-width: 520px) {
  body { overflow: auto; }
  .wrap { height: auto; }
  .scene { position: relative; inset: auto; aspect-ratio: 1.6 / 1; }
  .copy { position: static; display: grid; margin-top: 24px; padding: 0 20px; min-height: 230px; }
  .item, .item.left, .item.right { position: static; transform: none; width: auto; grid-area: 1 / 1; align-self: start; }
  .item h2 { font-size: clamp(1.8rem, 8vw, 2.4rem); }
  .item p { font-size: 1.1rem; max-width: none; }
  .controls { position: static; transform: none; justify-content: center; margin: 12px 0 28px; }
  .slot .ph span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .hole, .slot, .item h2, .item p, .dot { transition-duration: .01s; transition-delay: 0s !important; }
}
</style>

</head>
<body>
<main>
  <div class="wrap">
    <div class="scene" id="scene" aria-label="Escena con las cuatro ilustraciones">
      <div class="hole" id="hole"></div>
    </div>
    <div class="copy" id="copy" aria-live="polite"></div>
  <div class="controls">
    <button class="nav" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="nav" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  </div>
</main>

];

function setImage(slot, file) {
  if (!file || !file.type.startsWith("image/")) return;
  const r = new FileReader();
  r.onload = () => {
    slot.querySelector(".ph")?.remove();
    let img = slot.querySelector("img");
    if (!img) { img = document.createElement("img"); img.alt = ""; slot.appendChild(img); }
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

  s.setAttribute("aria-label", "Ilustración de " + it.t);
  s.innerHTML = '<div class="ph">' + camera + '<span>Ilustración ' + (i + 1) + '</span></div>';
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.hidden = true; input.id = "file" + i;
  input.addEventListener("change", () => setImage(s, input.files[0]));
  s.appendChild(input);
  s.addEventListener("click", () => { if (i === active) input.click(); else go(i); });
  ["dragenter","dragover"].forEach(ev => s.addEventListener(ev, e => { e.preventDefault(); s.classList.add("drag"); }));
  ["dragleave","drop"].forEach(ev => s.addEventListener(ev, e => { e.preventDefault(); s.classList.remove("drag"); }));
  s.addEventListener("drop", e => setImage(s, e.dataTransfer.files[0]));
  if (art[i]) {
    s.querySelector(".ph").remove();
    const img = document.createElement("img");
    img.alt = it.t; img.src = art[i];
    s.insertBefore(img, input);
  }
  scene.appendChild(s); slots.push(s);

  const t = document.createElement("div");
  t.className = "item " + side[i];
  // el texto queda a una distancia fija del círculo, no pegado al borde de la pantalla
  t.style.width = Math.min(48, side[i] === "right" ? 97 - (xs[i] + 20.5) : (xs[i] - 20.5) - 3) + "%";
  t.style.setProperty("--pos", (side[i] === "right" ? xs[i] + 20.5 : 100 - xs[i] + 20.5) + "%");
  t.innerHTML = '<h2></h2><p></p>';
  t.querySelector("h2").textContent = it.t;
  t.querySelector("p").textContent = it.d;
  copy.appendChild(t); texts.push(t);

  const d = document.createElement("button");
  d.className = "dot"; d.setAttribute("aria-label", it.t);
  d.addEventListener("click", () => go(i));
  dotsEl.appendChild(d); dots.push(d);
});

function placeHole() {
  const W = scene.clientWidth, H = scene.clientHeight;
  const size = Math.min(W * 0.29, H * 0.86);       // grande, pero sin dejar ver a las vecinas
  const cx = xs[active] / 100 * W, cy = H / 2;
  hole.style.width = hole.style.height = size + "px";
  scene.style.setProperty("--sw", (size * 0.414) + "px");   // las ilustraciones se miden contra el círculo
  hole.style.transform = "translate(" + (cx - size / 2) + "px," + (cy - size / 2) + "px)";
}
function render() {
  slots.forEach((s, i) => s.classList.toggle("on", i === active));
  texts.forEach((t, i) => t.classList.toggle("on", i === active));
  dots.forEach((d, i) => d.setAttribute("aria-current", i === active));
  placeHole();
}
function go(i) { active = (i + n) % n; render(); }
document.getElementById("prev").onclick = () => go(active - 1);
document.getElementById("next").onclick = () => go(active + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(active - 1);
  if (e.key === "ArrowRight" || e.key === "ArrowDown") go(active + 1);
});
addEventListener("resize", placeHole);
hole.style.transition = "none"; render(); void hole.offsetWidth; hole.style.transition = "";
</script>
</body>
</html>
