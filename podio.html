const stage=document.getElementById('stage'),cols=[],cones=[];
XS.forEach((x,i)=>{
  const c=document.createElement('div');c.className='cone';c.style.left=(x-135)+'px';stage.appendChild(c);cones.push(c);
});
XS.forEach((x,i)=>{
  const col=document.createElement('div');col.className='col';col.style.left=(x-90)+'px';
  col.innerHTML='<div class="ped"></div><div class="fig"><img src="'+IMG_NEGRO+'" alt=""><img class="on" src="'+IMG_NARANJA+'" alt=""></div>';stage.appendChild(col);cols.push(col);
});
const o=s=>Math.min(1,Math.max(0,s/T));
const A=(el,fr)=>el.animate(fr,{duration:T*1000,fill:'both',easing:'linear'});
const E='cubic-bezier(.3,1.4,.5,1)';
// luz que busca: lista de [segundo, x, opacidad]
const seek=document.getElementById('seek');
function seeker(path){
  const fr=[{offset:0,opacity:0,transform:'translateX(100px)'}];
  path.forEach(([s,x,op],i)=>fr.push({offset:o(s),opacity:op,transform:'translateX('+(x-220)+'px)',easing:'ease-in-out'}));
  fr.push({offset:1,opacity:0,transform:'translateX(0px)'});
  return A(seek,fr);
}
const k=ORDER.map(i=>LIGHT[ORDER.indexOf(i)]);
const L=ORDER.map((idx,n)=>({idx,t:LIGHT[n]}));
const R=XS[L[0].idx];
// vaivén de un lado al otro y se queda en la primera personita
const path=[[0,350,0],[.6,350,1],[1.8,610,1],[3.0,350,1],[4.2,610,1],[5.4,350,1],[L[0].t-.4,R,1],[L[0].t+.3,R,0]];
seeker(path);
// cada personita
L.forEach(({idx,t})=>{
  const col=cols[idx],ped=col.querySelector('.ped'),fig=col.querySelector('.fig'),cone=cones[idx];
  A(ped,[{offset:0,height:'46px',width:'130px'},{offset:o(t),height:'46px',width:'130px',easing:E},{offset:o(t+.9),height:'110px',width:'150px'},{offset:1,height:'110px',width:'150px'}]);
  A(fig,[{offset:0,transform:'scale(1)'},{offset:o(t),transform:'scale(1)',easing:E},{offset:o(t+.9),transform:'scale(1.6)'},{offset:1,transform:'scale(1.6)'}]);
  A(fig.querySelector('.on'),[{offset:0,opacity:0},{offset:o(t+.1),opacity:0,easing:'ease-out'},{offset:o(t+.7),opacity:1},{offset:1,opacity:1}]);
  A(cone,[{offset:0,opacity:0,transform:'scaleY(.4)'},{offset:o(t-.1),opacity:0,transform:'scaleY(.4)',easing:'ease-out'},{offset:o(t+.5),opacity:1,transform:'scaleY(1)'},{offset:1,opacity:1,transform:'scaleY(1)'}]);
});
const fit=document.getElementById('fit');
function rs(){const s=Math.min(innerWidth/960,innerHeight/540);fit.style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',rs);rs();
const q=new URLSearchParams(location.search);
if(q.get('bg'))document.body.classList.add('bg');
const all=f=>document.getAnimations().forEach(f);
if(q.get('t')){all(a=>{a.pause();a.currentTime=parseFloat(q.get('t'))*1000})}
else document.body.addEventListener('click',()=>all(a=>{a.currentTime=0;a.play()}));
</script></body></html>
