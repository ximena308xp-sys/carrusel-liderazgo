<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podio de talento</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Poppins',sans-serif}
body.bg{background:radial-gradient(ellipse at 60% 40%,#1c5931,#0f3a1e)}
#fit{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:center}
.platform{position:absolute;left:70px;top:446px;width:820px;height:64px;background:linear-gradient(#fff,#d9dbd8);clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);box-shadow:0 10px 20px rgba(0,0,0,.2)}
.seek,.cone{position:absolute;top:0;pointer-events:none;opacity:0;transform-origin:50% 0}
.seek{width:440px;height:470px;left:0;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,255,255,.30),rgba(255,255,255,.05));filter:blur(3px)}
.cone{width:270px;height:470px;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.07));filter:blur(2px)}
.col{position:absolute;bottom:85px;width:180px;display:flex;flex-direction:column-reverse;align-items:center}
.ped{position:relative;width:130px;height:46px;background:linear-gradient(90deg,#d6b068,#f2d091 38%,#f8e3b3 62%,#d6b068);border-radius:0 0 65px 65px/0 0 15px 15px}
.ped:before{content:"";position:absolute;left:0;top:-15px;width:100%;height:30px;border-radius:50%;background:#f8e6b8}
.fig{position:relative;z-index:2;width:43px;height:100px;margin-bottom:-4px;transform-origin:50% 100%;color:#111}
.fig svg{width:100%;height:100%;display:block}
.lab{position:absolute;width:200px;text-align:center;top:92px;opacity:0;color:#fff}
.lab .st{width:38px;height:38px;border-radius:50%;background:#f1b542;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.lab .st svg{width:20px;height:20px}
.lab b{font-size:21px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.5)}
</style></head><body>
<div id="fit">
  <div class="seek" id="seek"></div>
  <div class="platform"></div>
  <div id="stage"></div>
</div>
<script>
// ===== CAMBIA AQUÍ =====
const T=20;
const NAMES=["Resiliente","Creativo","Innovador"];   // izquierda, centro, derecha
const XS=[230,480,730];                               // posición de cada personita
const ORDER=[2,0,1];                                  // orden en que se iluminan (derecha, izquierda, centro)
const LIGHT=[6.0,9.2,12.4];                           // segundo en que se ilumina cada una
const ORANGE="#f1a54a";
// =======================
const NS='http://www.w3.org/2000/svg';
const person='<svg viewBox="0 0 60 140"><g fill="currentColor"><circle cx="30" cy="15" r="14"/><rect x="14" y="34" width="32" height="54" rx="11"/><rect x="3" y="36" width="10" height="50" rx="5"/><rect x="47" y="36" width="10" height="50" rx="5"/><rect x="17" y="82" width="12" height="55" rx="6"/><rect x="31" y="82" width="12" height="55" rx="6"/></g></svg>';
const star='<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
const stage=document.getElementById('stage'),cols=[],cones=[],labs=[];
XS.forEach((x,i)=>{
  const c=document.createElement('div');c.className='cone';c.style.left=(x-135)+'px';stage.appendChild(c);cones.push(c);
});
XS.forEach((x,i)=>{
  const col=document.createElement('div');col.className='col';col.style.left=(x-90)+'px';
  col.innerHTML='<div class="ped"></div><div class="fig">'+person+'</div>';stage.appendChild(col);cols.push(col);
  const l=document.createElement('div');l.className='lab';l.style.left=(x-100)+'px';
  l.innerHTML='<div class="st">'+star+'</div><b>'+NAMES[i]+'</b>';stage.appendChild(l);labs.push(l);
});
const o=s=>Math.min(1,Math.max(0,s/T));
const A=(el,fr)=>el.animate(fr,{duration:T*1000,fill:'both',easing:'linear'});
const E='cubic-bezier(.3,1.4,.5,1)';
// luz que busca: lista de [segundo, x, opacidad]
const seek=document.getElementById('seek');
function seeker(path){
  const fr=[{offset:0,opacity:0,transform:'translateX(100px)'}];
  path.forEach(([s,x,op],i)=>fr.push({offset:o(s),opacity:op,transform:'translateX('+(x-220)+'px)',easing:'ease-in-out'}));
  fr.push({offset:1,opacity:0,transform:'translateX(0px)'});
  return A(seek,fr);
}
const k=ORDER.map(i=>LIGHT[ORDER.indexOf(i)]);
const L=ORDER.map((idx,n)=>({idx,t:LIGHT[n]}));
const path=[[0,400,0],[.8,400,1]];
// 1.ª búsqueda: vaga y se detiene en la 1.ª
path.push([1.8,610,1],[2.8,330,1],[3.7,560,1],[4.5,430,1],[5.3,XS[L[0].idx],1],[L[0].t-.1,XS[L[0].idx],1],[L[0].t+.3,XS[L[0].idx],0]);
// 2.ª búsqueda
const t1=L[0].t+1.0,t2=L[1].t;
path.push([t1,XS[L[0].idx]-60,0],[t1+.3,XS[L[0].idx]-60,1],[t1+1.2,500,1],[t1+2.0,XS[L[1].idx]+40,1],[t2-.1,XS[L[1].idx],1],[t2+.3,XS[L[1].idx],0]);
// 3.ª búsqueda
const t3=L[2].t,u1=t2+1.0;
path.push([u1,260,0],[u1+.3,260,1],[u1+1.2,640,1],[u1+2.0,560,1],[t3-.1,XS[L[2].idx],1],[t3+.3,XS[L[2].idx],0]);
seeker(path);
// cada personita
L.forEach(({idx,t})=>{
  const col=cols[idx],ped=col.querySelector('.ped'),fig=col.querySelector('.fig'),cone=cones[idx],lab=labs[idx];
  A(ped,[{offset:0,height:'46px',width:'130px'},{offset:o(t),height:'46px',width:'130px',easing:E},{offset:o(t+.9),height:'92px',width:'150px'},{offset:1,height:'92px',width:'150px'}]);
  A(fig,[{offset:0,transform:'scale(1)',color:'#111'},{offset:o(t),transform:'scale(1)',color:'#111',easing:E},{offset:o(t+.9),transform:'scale(1.4)',color:ORANGE},{offset:1,transform:'scale(1.4)',color:ORANGE}]);
  A(cone,[{offset:0,opacity:0,transform:'scaleY(.4)'},{offset:o(t-.1),opacity:0,transform:'scaleY(.4)',easing:'ease-out'},{offset:o(t+.5),opacity:1,transform:'scaleY(1)'},{offset:1,opacity:1,transform:'scaleY(1)'}]);
  A(lab,[{offset:0,opacity:0,transform:'translateY(14px)'},{offset:o(t+.7),opacity:0,transform:'translateY(14px)',easing:'ease-out'},{offset:o(t+1.3),opacity:1,transform:'none'},{offset:1,opacity:1,transform:'none'}]);
});
const fit=document.getElementById('fit');
function rs(){const s=Math.min(innerWidth/960,innerHeight/540);fit.style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',rs);rs();
const q=new URLSearchParams(location.search);
if(q.get('bg'))document.body.classList.add('bg');
const all=f=>document.getAnimations().forEach(f);
if(q.get('t')){all(a=>{a.pause();a.currentTime=parseFloat(q.get('t'))*1000})}
else document.body.addEventListener('click',()=>all(a=>{a.currentTime=0;a.play()}));
</script></body></html>
